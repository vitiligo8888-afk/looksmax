##
# looksmax-economy — español neutro para México.
#
# Esta extensión no dibuja nada por su cuenta. Lo que sí le pertenece es el
# vocabulario de motivos del libro mayor: cada movimiento de puntos lleva un
# `reason` y looksmax-store lo imprime tal cual en la tabla de movimientos, así
# que un miembro ve `post.read_through` en su propio historial. Las etiquetas
# viven aquí, junto a los códigos que nombran.
#
# Son etiquetas de una celda de tabla: frases nominales cortas, sin verbo
# conjugado y sin punto final, para que la columna se lea de un vistazo.
##

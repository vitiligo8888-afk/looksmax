##
# looksmax-economy — English source strings.
#
# This extension renders nothing itself: no JS, no controller, no view, no
# notification, and its only prose is console command help. The audit is right
# that it has zero hardcoded user-visible strings.
#
# What it DOES own is a vocabulary that another extension renders raw. Every
# row in the ledger carries a `reason` from Ledger::AWARDS (and from the
# store's spend paths), and looksmax-store/js/dist/forum.js:661 puts that value
# straight into a table cell under the heading "Reason", so a member reading
# their own points history is shown `post.read_through`. The label set belongs
# here, beside the codes it names, so that whichever surface renders the
# history next uses the same words. See locale/i18n-map.json.
##
local-looksmax-economy:

  lib:

    # Keyed by the literal ledger reason, so a lookup is
    # `local-looksmax-economy.lib.reason.` + row.reason with no mapping table.
    reason:
      admin:
        adjust: Admin adjustment
      discussion:
        started: Thread started
      post:
        created: Post
        read_through: Read to the end
      reaction:
        received: Reaction received
        given: Reaction given
      best_answer:
        awarded: Best answer
      guide:
        published: Guide published
        sourced: Source cited in a guide
      thread:
        held: Held attention
      streak:
        day: Daily streak
        week: Weekly streak
        # New — paid by Ledger::credit(countsForRank:false), see Streaks::pay().
        # A duplicate `streak:` mapping key here would silently clobber day/week
        # above (YAML keeps only the last of a repeated key), so this lives
        # inside the SAME block rather than a second `streak:` entry.
        milestone: Streak milestone bonus
      import:
        legacy: Imported balance
      badge:
        earned: Badge earned
      store:
        purchase: Store purchase
        refund: Refund
        clawback: Charge reversed
        credits: Credits added
      tier:
        purchase: Membership purchase
      # New — paid by Ledger::credit(countsForRank:false), see
      # Ledger::refreshRank() for why it does not go through award().
      rank:
        milestone: Rank-up bonus
      # New — paid by Quests::claim() via Ledger::credit(countsForRank:true).
      # See src/Quests.php for why a quest reward counts toward rank.
      quest:
        daily: Daily quest
        weekly: Weekly quest

    # Shown when a ledger row carries a reason this pack does not name yet —
    # better than printing the code, and it keeps the raw-key sentinel quiet.
    reason_unknown: Adjustment

  # ── admin: every number the ledger pays or refuses ─────────────────────────
  # Read by js/dist/admin.js's registerSetting() calls. Labels are short on
  # purpose — the admin settings list is one field per row with no room for a
  # sentence, and the reasoning behind each default lives in Config.php's
  # comments, one setting-screen click away for anyone who opens the file.
  admin:
    settings:
      award_discussion_started: "Award: starting a discussion (points)"
      award_post_created: "Award: a reply (base points, before effort weighting)"
      award_reaction_received: "Award: receiving a reaction (points)"
      award_reaction_given: "Award: giving a reaction (points)"
      award_best_answer: "Award: best answer marked (points)"
      award_guide_published: "Award: posting into a guide tag (points)"
      award_read_through: "Award: a reader reaches the end of your thread (points)"
      award_thread_held: "Award: a reader stays 3+ minutes (points)"
      award_guide_sourced: "Award: a cited source in a guide (points)"
      award_streak_day: "Award: daily streak (points)"
      award_streak_week: "Award: weekly streak bonus (points)"
      award_import_legacy: "Award: legacy imported balance, per unit (points)"
      award_badge_earned: "Award: a badge is earned (points)"
      award_rank_up: "Award: reaching a new rank, one-time bonus (points, does not count toward rank)"
      award_streak_milestone: "Award: reaching a streak milestone, one-time bonus (points, does not count toward rank)"
      cap_post_created: "Daily cap: replies that pay (count per 24h)"
      cap_reaction_given: "Daily cap: reactions given that pay (count per 24h)"
      cap_reaction_received: "Daily cap: reactions received that pay (count per 24h)"
      cap_read_through: "Daily cap: read-through awards (count per 24h)"
      cap_thread_held: "Daily cap: held-attention awards (count per 24h)"
      streak_min_length: "Streak: minimum post length to count (characters)"
      streak_week_every: "Streak: pay the weekly bonus every N days"
      streak_milestones: "Streak: milestone lengths that pay a one-time bonus (comma-separated days)"
      reaction_pair_cap: "Reactions: max times one account can pay another per day"
      reaction_max_age: "Reactions: posts older than this earn nothing when liked (days)"
      post_min_multiplier: "Post effort weighting: minimum multiplier"
      post_max_multiplier: "Post effort weighting: maximum multiplier"
      post_multiplier_divisor: "Post effort weighting: characters per 1.0x"
      quest_enabled: "Quests: turn the daily/weekly quest system on"
      quest_daily_post3_target: "Daily quest “Post 3 times”: amount required"
      quest_daily_post3_reward: "Daily quest “Post 3 times”: reward (points)"
      quest_daily_give3_target: "Daily quest “Give 3 reactions”: amount required"
      quest_daily_give3_reward: "Daily quest “Give 3 reactions”: reward (points)"
      quest_daily_received1_target: "Daily quest “Receive a reaction”: amount required"
      quest_daily_received1_reward: "Daily quest “Receive a reaction”: reward (points)"
      quest_daily_streak_target: "Daily quest “Hold your streak”: amount required"
      quest_daily_streak_reward: "Daily quest “Hold your streak”: reward (points)"
      quest_weekly_post15_target: "Weekly quest “Post 15 times”: amount required"
      quest_weekly_post15_reward: "Weekly quest “Post 15 times”: reward (points)"
      quest_weekly_thread1_target: "Weekly quest “Start a thread”: amount required"
      quest_weekly_thread1_reward: "Weekly quest “Start a thread”: reward (points)"
      quest_weekly_reactions25_target: "Weekly quest “Receive 25 reactions”: amount required"
      quest_weekly_reactions25_reward: "Weekly quest “Receive 25 reactions”: reward (points)"
      quest_weekly_streak7_target: "Weekly quest “7 day streak”: amount required"
      quest_weekly_streak7_reward: "Weekly quest “7 day streak”: reward (points)"

  # ── the streak/progress widget (js/dist/forum.js) ───────────────────────────
  forum:
    widget:
      toggle_title: Your earning progress
      day_streak_one: day streak
      day_streak_other: day streak
      to_milestone: "{count, plural, one {# day to a # day streak} other {# days to a # day streak}}"
      points_to_rank: "{count, plural, one {# point to {rank}} other {# points to {rank}}}"
      top_rank: Top rank reached
      goal_posts: Posts today
      goal_reactions: Reactions received today
      next_badge: "{count} to go for “{badge}”"
      celebrate_streak: "{count} day streak! Keep it going."
      celebrate_rank: "You reached {rank}!"
      celebrate_achievement: "You earned “{name}”!"

    wheel:
      title: Daily wheel
      spin: Spin
      error:
        guest: Log in to spin.
        already: You already spun today. Come back tomorrow.
        failed: Could not spin. Try again in a moment.
    quests:
      daily: Daily
      weekly: Weekly
      claim: Claim
      claimed: Claimed
      celebrate: "Quest complete! +{count} points"
      post3:
        name: Post 3 times
      give3:
        name: Give 3 reactions
      received1:
        name: Receive a reaction
      streak:
        name: Hold today's streak
      post15:
        name: Post 15 times this week
      thread1:
        name: Start a thread
      reactions25:
        name: Receive 25 reactions this week
      streak7:
        name: Hold a 7 day streak
      error:
        guest: Sign in to claim quests.
        failed: Could not process the quest. Try again.
        not_claimable: This quest is not ready to claim yet.

# Looksmax Store — español.
#
# Registro: tú, nunca usted, nunca vos, sin vosotros. Español neutro de
# América Latina, con México como público principal. `clic`, no `click`.
#
# Notas de traducción que no son obvias:
#
#  * "credits" es `créditos`, la moneda del foro. No se traduce como "puntos":
#    looksmax-economy ya usa "puntos" para el contador de por vida y confundir
#    los dos es confundir lo que se gasta con lo que se acumula.
#  * "tier" / "membership" son la misma cosa aquí: `membresía`.
#  * "bump" (subir un hilo al principio de la lista) es `empujar`. No existe un
#    término establecido en español para esto en foros; `empujar` se entiende
#    por el contexto y es lo que ya usa el resto de la interfaz.
#  * "boost" es `impulso`. "streak" es `racha`.
#  * Los plurales llevan las dos ramas escritas porque en español cambia el
#    verbo, no solo el sustantivo: "queda 1 día" / "quedan 2 días".


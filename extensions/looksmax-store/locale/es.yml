    # ── copia del catálogo original ────────────────────────────────────────
    #
    # TODAVÍA NO ESTÁ CONECTADO. Ver la sección `deferred` de i18n-map.json:
    # hoy src/Seed.php escribe esta prosa directamente en `store_items.name` y
    # `.blurb`, y una clave de traducción no puede vivir en una columna que un
    # administrador edita desde un campo de texto.
    item:
      boost-2x-24h:
        name: Ganancias dobles, 24 horas
        blurb: Todo lo que ganes cuenta doble por un día. Se suma al multiplicador de tu membresía.
      boost-2x-7d:
        name: Ganancias dobles, 7 días
        blurb: Lo mismo, pero por una semana. Sale más barato por día que comprar siete del anterior.
      cap-raise-24h:
        name: Tope diario ampliado, 24 horas
        blurb: Duplica por un día los topes diarios que frenan el farmeo. Para los días en que de verdad estás escribiendo así.
      streak-freeze:
        name: Congelador de racha
        blurb: Cubre un día perdido para que la racha diaria sobreviva. Se gasta solo, del más viejo al más nuevo.
      thread-highlight-3d:
        name: Resaltar un hilo, 3 días
        blurb: Tu hilo lleva un borde marcado en la lista de discusiones durante tres días. Un hilo, el que tú elijas, canjeado cuando quieras.
      thread-sticky-24h:
        name: Fijar un hilo, 24 horas
        blurb: Fija uno de tus hilos arriba de su etiqueta por un día y después lo suelta. Un moderador puede terminarlo antes.
      thread-bump:
        name: Empujar un hilo
        blurb: Regresa uno de tus hilos al principio de la lista de recientes sin escribir "bump".
      username-change:
        name: Cambio de nombre de usuario
        blurb: Un cambio del nombre de tu cuenta. Tu nombre anterior queda registrado en el pedido.
      box-colour:
        name: Caja de colores
        blurb: Un estilo de nombre que todavía no tengas. 55% sólido, 38% degradado, 7% animado. El estilo animado más barato vale 12.000.
      box-frame:
        name: Caja de marcos
        blurb: Un marco de avatar que todavía no tengas. 40% común, 30% poco común, 24% raro, 6% épico.
      tier-vip-lifetime:
        name: VIP de por vida
        blurb: VIP que nunca vence y nunca hay que renovar. Existen veinticinco.
      bundle-vip-start:
        name: Arranque VIP
        blurb: Un mes de VIP, el degradado Oceanic y un día de ganancias dobles. Juntos cuestan menos que los tres por separado.
      credits-10k:
        name: 10.000 créditos
        blurb: El pago con tarjeta todavía no está activo. Este es un camino de compra de prueba y no cobra nada.
      credits-50k:
        name: 50.000 créditos
        blurb: El pago con tarjeta todavía no está activo. Este es un camino de compra de prueba y no cobra nada.


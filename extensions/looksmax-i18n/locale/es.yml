      anabolics: Anabólicos
      softmaxing: Softmaxing
      looksmaxing: Looksmaxing
      peligrosomaxing: Peligrosomaxing
      best_guides: Mejores Guías

    news:
      heading: Novedades
      empty: Nada nuevo por ahora.
      see_all: Ver todo
      posted: "{when}"
      dismiss: Ocultar
      pinned: Fijado

# ── Overrides on the sourced pack ────────────────────────────────────────────
#
# flarum-lang/spanish 1.13.2 is good Spanish and is used as-is almost
# everywhere. Two kinds of key are replaced here, and only those two.
#
# 1. Keys the pack has not caught up with. It tracks core up to roughly 1.8.15
#    and this install runs 1.8.18; the two additions a forum visitor can
#    actually see are the connection errors below.
#
# 2. A handful of interjections. The pack renders errors as "¡Recórcholis!",
#    "¡Nanay de la China!", "¡Para el carro!" and "¡Caramba!". Those are dated
#    peninsular exclamations — "nanay de la China" in particular reads as a
#    grandparent's phrase and is not something anyone in Mexico says. The
#    audience here is Mexican and the register of the rest of the forum is
#    plain, so the error text is plain too. The information in each message is
#    unchanged; only the exclamation is dropped.
core:
  lib:
    error:
      network_message: Parece que hay un problema con tu conexión. Revísala e inténtalo de nuevo.
      offline_message: Parece que no tienes conexión. Revísala e inténtalo de nuevo.
      generic_message: Algo salió mal. Recarga la página e inténtalo de nuevo.
      not_found_message: No encontramos lo que pediste.
      permission_denied_message: No tienes permiso para hacer eso.
      rate_limit_exceeded_message: Vas demasiado rápido. Espera unos segundos e inténtalo otra vez.
  views:
    error:
      not_found: No encontramos esa página.
      permission_denied: No tienes permiso para ver esta página.
      unknown: Hubo un error al cargar la página.

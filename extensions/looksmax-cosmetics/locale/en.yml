##
# looksmax-cosmetics — English. This is the TRANSLATION.
#
# Spanish is this forum's default locale and locale/es.yml is the source: the
# strings there were authored, the strings here follow them. If the two ever
# disagree, es.yml is right.
#
# The eight shared frames keep the names looksmax-ranks already uses in English
# (Bronze Laurel, Ember, Glacier…) for the same reason es.yml keeps its own:
# somebody who bought "Ember" in the store has to find "Ember" in their
# wardrobe, in either language.
##
local-looksmax-cosmetics:

  forum:

    title: Personalisation
    sub: The frames and covers you own. Try them on here before you wear them.
    loading: Loading…
    guest: Sign in to personalise your profile.

    none: None
    none_hint: No decoration

    apply: Apply
    applying: Applying…
    revert: Discard

    note: >-
      Animated frames stop on their own when they scroll off screen, and turn
      off entirely if your system asks for reduced motion.

    mirror:
      saved: This is how the forum sees you
      unsaved: Unsaved preview

    section:
      frames: Avatar frames
      banners: Profile covers
      count: "{owned} of {total}"

    owned:
      bought: Bought
      tier: Included with your membership
      badge: Earned
      generic: In your inventory

    lock:
      buy: In the store for {price}
      tier: Needs {tier} membership
      badge: Needs the {badge} badge
      award: Awarded only

    error:
      guest: Sign in first.
      unknown_action: No such action.
      unknown_kind: No such cosmetic type.
      no_such_item: No such cosmetic.
      not_owned: You do not own that cosmetic.
      failed: Could not save. Try again.


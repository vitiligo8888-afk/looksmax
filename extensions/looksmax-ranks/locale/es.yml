##
# looksmax-ranks — español neutro para México.
#
# Decisiones explícitas de traducción (no son accidentes):
#
#  * ESCALAFÓN DE RANGOS. Los nombres se traducen (Hierro, Bronce, Plata, Oro,
#    Platino, Diamante), porque son sustantivos comunes y aparecen debajo de
#    cada nombre de usuario en cada publicación: dejarlos en inglés haría que
#    la identidad del foro se leyera a medias. La única excepción es
#    "Greycel": es jerga acuñada de la comunidad looksmax, no tiene
#    equivalente y los usuarios ya la usan tal cual.
#    "Master" -> "Maestro" y "Ascended" -> "Ascendido" quedan en masculino,
#    igual que los rangos de los juegos que este público ya conoce.
#
#  * MEMBRESÍAS. "Looksmax+", "VIP" y "Founder" son nombres de producto y se
#    quedan igual en los dos idiomas. "Founder" además evita el problema de
#    concordancia de "Fundador/Fundadora"; la insignia equivalente sí se
#    traduce, como "Miembro fundador", porque ahí "miembro" es epiceno.
#    "Standard" -> "Estándar" y "Elite" -> "Élite" sí se traducen: son
#    adjetivos invariables con forma exacta en español.
#
#  * COSMÉTICOS. Los nombres de color se traducen cuando existe la palabra en
#    español (Carmesí, Esmeralda, Pan de oro). Se dejan igual los que son la
#    misma palabra (Mistral, Aurora, Kraken) y los acuñados por el foro
#    original (Zephir), porque son la identidad de un artículo que ya compró
#    gente que migró. El identificador interno (`slug`) nunca cambia.
#
#  * INSIGNIAS. Se traducen. Donde el inglés usa un sustantivo de agente que
#    en español obligaría a marcar género ("Conversationalist", "Guide
#    Author", "Contributor"), se reescribe como frase verbal o sustantivo
#    invariable en lugar de escribir "Autor/a".
#
#  * NÚMEROS. Los que van dentro de un texto fijo conservan la coma de
#    millares, que es la que usa México ("1,000 publicaciones"). Todo número
#    calculado se formatea con window.lmxI18n, nunca aquí.
##

##
# looksmax-ranks — English source strings.
#
# `lib.*` mirrors src/Catalog.php. The catalogue stays a pure PHP data
# structure: its `name`/`blurb`/`headline` literals are NOT replaced by keys,
# because two other extensions read those constants directly and one of them
# (looksmax-userinfo/src/RankSource.php:106,121) MATCHES ON THE NAME VALUE to
# resolve `/rank gold`. A translation key there would break that lookup
# silently. Instead Catalog's lookup methods run every row they return through
# Catalog::localize(), which derives the key from the row's slug and falls back
# to the English literal when a key is missing. So the literals in Catalog.php
# are the fallback of record and these keys are what a reader actually sees.
##
local-looksmax-ranks:

  forum:

    hover:
      # The chip that follows a username. `blurb` is already localised by the
      # time it reaches this string.
      rank_title: "{rank} — {blurb}"
      tier_title: "{tier} member"
      badges_title: "{count, plural, one {# badge} other {# badges}}"
      stat_badges: badges
      stat_rank: rank
      # Shown in place of a rank name that failed to load.
      rank_unknown: Greycel
      stat_empty: "—"

    achievements:
      title: Achievements
      guest: Sign in to see your achievements.
      points: Points
      lifetime: Lifetime
      badges: Badges
      to_next: "{count} to the next rank"
      next_badge: "{count} to go for “{badge}”"
      owned: Earned
      rarity: "{pct}% of members"
      hint: "{count, plural, one {Tap an earned badge to pin it next to your name (you have # slot).} other {Tap an earned badge to pin it next to your name (you have # slots).}}"

    points:
      title: Your balance — spend it in the store

    leaders:
      heading: Standing
      # The two leaderboard tabs. Short by design: they sit in a 100px header.
      window_week: 7d
      window_all: all
      entry_title: "{username} — {rank}"
      empty: nothing earned yet

    store:
      # Shown where a store item names the tier that unlocks it, and no tier
      # does — the item is granted, never sold.
      requires_invite: an invitation

    error:
      guest: sign in first
      unknown_action: unknown action
      failed: that did not work
      no_such_item: no such item
      not_for_sale: "{item} is not for sale — it is awarded"
      already_owned: you already own that
      not_enough_points: not enough points
      grant_failed: could not grant the item; you were refunded
      no_such_tier: no such tier
      tier_granted_only: "{tier} is granted, not sold"
      tier_downgrade: you are already on {current}, which is above {target}
      title_needs_tier: Looksmax+ or above can set a custom title
      title_too_long: "{count, plural, one {your tier allows # character} other {your tier allows # characters}}"
      title_empty: a title has to contain something visible
      title_colour_needs_tier: VIP or above can colour the title
      showcase_too_many: "{count, plural, one {your tier has # showcase slot} other {your tier has # showcase slots}}"
      showcase_unearned: "you have not earned: {badges}"
      accent_needs_tier: VIP or above can set a profile accent
      no_such_style: no such style
      style_needs_tier: "{tier} or above can equip {kind} styles"
      style_not_on_tier: not available on your tier
      style_not_owned: you do not own that style
      no_such_frame: no such frame
      frame_needs_tier: "{tier} or above can equip that frame"
      frame_not_owned: you do not own that frame
      unknown_cosmetic: unknown cosmetic type


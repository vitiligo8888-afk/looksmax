# The master must be root to bind :80, but the WORKERS inherit `user` — and the
# workers are what parse request bodies and serve files. `www-data` (not a new
# `nginx` user) because php:8.3-fpm-alpine already ships www-data:x:82:82, the
# php-fpm pool already runs as it, and entrypoint.sh already chowns storage and
# public/assets to it. A third identity would need its own read grants.
user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Two sinks on purpose. stdout is what `docker logs` shows and is where an
  # operator looks first. The FILE is what fail2ban reads: with ingress going
  # straight from the tunnel to this container, nothing else on the box sees a
  # request, so a jail watching the host's proxy log would silently protect
  # nothing. `$remote_addr` is already the real client here because of the
  # real_ip block above, so a ban lands on the attacker rather than on loopback.
  log_format lmx '$remote_addr - - [$time_local] "$request" $status '
                 '$body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout lmx;
  access_log /var/log/nginx/access.log lmx;
  sendfile on;
  client_max_body_size 32m;

  # ---------------------------------------------------------------- client IP
  # In production this container is the origin of a Cloudflare tunnel:
  # cloudflared dials out from the host and proxies in over the published
  # loopback port, so EVERY request arrives from the docker gateway
  # (172.16.0.0/12) or loopback. Without this block Flarum records 127.0.0.1 as
  # the author IP of every post, and any rate-limit or IP ban either does
  # nothing or bans the whole site at once.
  #
  # CF-Connecting-IP is preferred over X-Forwarded-For: Cloudflare sets it to
  # the single real client address and, unlike XFF, it cannot be extended by a
  # client-supplied header. It is only trusted from the addresses below, which
  # are private ranges the internet cannot reach given the publish guard.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;

  # TLS terminates at Cloudflare, so the origin speaks plain HTTP. Anything that
  # asks $_SERVER['HTTPS'] (Flarum's URL generator among them) must be told the
  # EDGE used TLS, and X-Forwarded-Proto is the only truthful signal.
  map $http_x_forwarded_proto $fastcgi_https {
    default '';
    https   on;
  }

  server {
    listen 80;
    server_name _;
    root /flarum/app/public;
    index index.php;

    # Liveness, answered by nginx itself and independent of PHP, the database
    # and Flarum's boot. Ingress goes straight from the Cloudflare tunnel to
    # this container, so this is the only /healthz on the path; a 200 here with
    # a 500 on / means "the container serves, the forum does not", which is the
    # distinction monitoring needs and a bare `GET /` cannot make.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "lmx-app-ok\n";
    }

    # Flarum ships its own nginx rules; this mirrors them (deny the app
    # internals, route everything else through index.php).
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location /api { try_files $uri $uri/ /index.php?$query_string; }
    location /admin { try_files $uri $uri/ /index.php?$query_string; }

    location ~* \.php$ {
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_index index.php;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      # Set from X-Forwarded-Proto — see the map above. Empty when the edge used
      # plain HTTP, which is what PHP expects for "not HTTPS".
      fastcgi_param HTTPS $fastcgi_https;
      fastcgi_read_timeout 300;
    }

    location ~* ^/(?:vendor|storage/(?:logs|tmp|framework)|composer\.(?:json|lock)|auth\.json|config\.php|flarum)(?:$|/) {
      deny all;
      return 404;
    }
    # mime.types has no entry for .webmanifest, so without this the PWA
    # manifest is served as application/octet-stream. Chrome accepts it and
    # Safari does not, which makes "Add to Home Screen" silently fall back to a
    # screenshot of the page instead of using the app icon.
    location ~* \.webmanifest$ {
      default_type application/manifest+json;
      expires 7d;
      access_log off;
      # A manifest is always fetched in CORS mode, so it needs the same
      # allowance fonts do — see the note below.
      add_header Access-Control-Allow-Origin "*" always;
      try_files $uri /index.php?$query_string;
    }

    # Static assets, with CORS allowed.
    #
    # Fonts and manifests are ALWAYS fetched in CORS mode, even for a plain
    # same-site url. Flarum builds every asset url from the configured base url,
    # so the moment a reader reaches the forum on any other hostname — a tunnel,
    # localhost, an IP, a staging name — those fetches become cross-origin and
    # fail without this header. Measured: 6 font requests and the manifest
    # failing with net::ERR_FAILED on a local render, which silently stripped
    # every icon glyph and the brand typeface out of the screenshots we verify
    # the UI with.
    #
    # `*` is the correct value here: these are public static files served to
    # anonymous readers, there are no credentials on the request, and the
    # header conveys no authority beyond "anyone may read a public font".
    location ~* \.(?:css|js|gif|ico|jpe?g|png|svg|woff2?|ttf|eot)$ {
      expires 30d;
      access_log off;
      add_header Access-Control-Allow-Origin "*" always;
      try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ /\.(?!well-known) { deny all; }
  }
}
